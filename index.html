<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL to loadstring</title>
    <style>
        body {
            background: #f5f5f5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }
        p.sub {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #333;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background: #555;
        }
        .result {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .result.show {
            display: block;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            background: #fafafa;
            margin-bottom: 10px;
            resize: none;
            box-sizing: border-box;
        }
        .copy-btn {
            background: #0088cc;
        }
        .copy-btn:hover {
            background: #00aaff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL to loadstring</h1>
    <p class="sub">URLを入力して、Roblox用のloadstringコードを生成します</p>
    
    <label>Rawリンク (URL)</label>
    <input type="text" id="urlInput" placeholder="https://example.com/raw/123" autocomplete="off">

    <button id="generateBtn">生成する</button>

    <div class="result" id="result">
        <label>生成されたコード</label>
        <textarea id="resultCode" rows="3" readonly></textarea>
        <button class="copy-btn" id="copyBtn">コピー</button>
    </div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const resultDiv = document.getElementById('result');
    const resultCode = document.getElementById('resultCode');

    document.getElementById('generateBtn').addEventListener('click', () => {
        let url = urlInput.value.trim();

        if (!url) {
            alert('URLを入力してください');
            return;
        }

        // もしURLじゃなくてただのIDやテキストが来た場合の簡易チェック（httpから始まらないならエラーにする）
        if (!url.startsWith('http')) {
            alert('有効なURL（http または https から始まるもの）を入力してください');
            return;
        }

        // loadstringで囲む
        const code = `loadstring(game:HttpGet("${url}"))()`;
        
        // 結果を表示
        resultCode.value = code;
        resultDiv.classList.add('show');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        resultCode.select();
        document.execCommand('copy');
        
        // ボタンの文字を一時的に変えてコピーしたことを知らせる
        const btn = document.getElementById('copyBtn');
        const originalText = btn.textContent;
        btn.textContent = 'コピーしました！';
        setTimeout(() => {
            btn.textContent = originalText;
        }, 2000);
    });
</script>

</body>
</html>
